name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build launcher
        run: dotnet build src/PawsPatchLauncher/PawsPatchLauncher.csproj -c Release
      - name: Run tests
        run: dotnet run --project tests/PawsPatchLauncher.Tests/PawsPatchLauncher.Tests.csproj -c Release
      - name: Test isolated account database
        working-directory: tools/AdminDatabaseTests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node run.mjs
      - name: Test private download service
        run: |
          node supabase/functions/reborn-builds/handler.test.mjs
          node supabase/functions/reborn-builds/github.test.mjs
      - name: Test independent actions during installation
        shell: pwsh
        run: ./tools/TestIndependentActions.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'independent-actions')
      - name: Test localized release notes
        shell: pwsh
        run: ./tools/TestReleaseNotes.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'release-notes')

