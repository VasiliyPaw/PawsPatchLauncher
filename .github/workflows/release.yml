name: Publish launcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet run --project tests/PawsPatchLauncher.Tests/PawsPatchLauncher.Tests.csproj -c Release
      - name: Publish autonomous Windows build
        shell: pwsh
        run: |
          dotnet publish src/PawsPatchLauncher/PawsPatchLauncher.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false -o artifacts/win-x64
          Compress-Archive -Path artifacts/win-x64/PawsPatchLauncher.exe,artifacts/win-x64/launcher.config.json `
            -DestinationPath "artifacts/PawsPatchLauncher-$env:GITHUB_REF_NAME-win-x64.zip"
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            artifacts/win-x64/PawsPatchLauncher.exe `
            "artifacts/PawsPatchLauncher-$env:GITHUB_REF_NAME-win-x64.zip" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "Paw's Patch Launcher $env:GITHUB_REF_NAME" `
            --notes-file "docs/release-$($env:GITHUB_REF_NAME.Substring(1)).md"
